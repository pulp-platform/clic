# This repository ships no Python code; this project exists only to pin the
# Python tooling used by the register generation flow. The generated register
# files are checked into src/, so this is only needed when regenerating them:
# run `make regs`.

[project]
name = "clic"
version = "0"
description = "Tooling environment for the RISC-V CLIC hardware IP"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
regs = [
    "peakrdl==1.5.0",
    "peakrdl-regblock==1.3.1",
    "peakrdl-rawheader==0.2.2",
]

[tool.uv]
# Nothing here is importable or installable, so do not try to build a wheel.
package = false
