name: lint

on: [ push, pull_request, workflow_dispatch ]

jobs:

  lint-license:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Check license
      uses: pulp-platform/pulp-actions/lint-license@v2.5.1
      with:
        license: |
          Copyright (\d{4}(-\d{4})?\s)?(ETH Zurich and University of Bologna|lowRISC contributors).
        exclude_paths: |
          .dir-locals.el
          .python-version
          uv.lock
          LICENSES/
    -
      name: Check license string
      run: |
        N_FILES_WITHOUT_LICENCE=$(grep -Lr -E "SPDX-License-Identifier: (SHL-0.51|Apache-2.0)" --exclude-dir=".git" --include \*.yml --include \*.sv --include \*.rdl . | wc -l )
        if [[ ${N_FILES_WITHOUT_LICENCE} -eq 0 ]]; then
          echo "All files contain SPDX-License-Identifier"
        else
          echo "Files missing SPDX-License-Identifier:"
          grep -Lr -E "SPDX-License-Identifier: (SHL-0.51|Apache-2.0)" --exclude-dir=".git" --include \*.yml --include \*.sv --include \*.rdl .
          false
        fi

  # The register blocks in src/ are generated from rdl/ and checked in, so they
  # can silently drift from their source. Regenerate them and require the result
  # to match. PeakRDL embeds no timestamp, path or version in its output, and
  # --locked pins the generator, so this is a content comparison and not a
  # source of flakes.
  regs-up-to-date:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    -
      name: Regenerate register blocks
      run: make regs PEAKRDL="uv run --locked --group regs peakrdl"
    -
      name: Check the checked-in files match
      run: |
        if ! git diff --exit-code -- src/; then
          echo "::error::Generated register files are out of date. Run 'make regs' and commit the result."
          exit 1
        fi
    -
      name: Check the memory map still elaborates
      # rdl/clic.rdl produces no checked-in artefact, so nothing above compiles
      # it. Exporting it here catches errors the leaf blocks cannot, such as
      # windows overlapping at the maximum configuration.
      run: make clic-defs clic-hdr PEAKRDL="uv run --locked --group regs peakrdl"

  lint-sv:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Run Verible
      uses: chipsalliance/verible-linter-action@main
      with:
        paths: hw
        extra_args: "--waiver_files .github/verible.waiver"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_error: true
        reviewdog_reporter: github-check

  slang:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # Skip on forks or pull requests from forks due to missing secrets.
    if: github.repository == 'pulp-platform/clic' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1

      - name: Generate file list
        shell: bash
        run: |
          bender checkout
          bender script flist-plus -t rtl > slang.f

      - name: Run slang
        uses: pulp-platform/pulp-actions/slang@v2.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewdog-name: slang-elaboration
          slang-flags: '-f slang.f --top clic'
