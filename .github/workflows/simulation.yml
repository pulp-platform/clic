name: simulation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    name: Verilator (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/phsauter/oseda-cli:2026.07
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        # Verilator resolves parameters at compile time, so each entry is a
        # separate build. These are hand-picked legal configurations rather than
        # a cross product: VSCLIC requires SSCLIC and VSPRIO requires VSCLIC,
        # and nothing in the RTL rejects a combination that violates that.
        include:
          # The RTL's own defaults: no S/U mode, no virtualization.
          - name: m-mode-only
            params: N_SOURCE=2 SSCLIC=0 USCLIC=0 VSCLIC=0 VSPRIO=0 N_VSCTXTS=0
          # Supervisor mode without vCLIC.
          - name: s-mode
            params: N_SOURCE=64 SSCLIC=1 USCLIC=0 VSCLIC=0 VSPRIO=0 N_VSCTXTS=0
          # Every feature on, with non-default vCLIC widths: more virtual
          # contexts and a wider VS priority field in the sort key.
          # INTCTLBITS is pinned to 8: any other value fails to elaborate
          # because clic.sv drives the INTCTLBITS-wide prio_i from an
          # unconditionally 8-bit intctl.
          - name: vclic-wide
            params: N_SOURCE=16 SSCLIC=1 VSCLIC=1 VSPRIO=1 N_VSCTXTS=8 VSPRIO_W=2 INTCTLBITS=8
          # Every feature on at the largest supported source count.
          - name: vclic-max
            params: N_SOURCE=256 SSCLIC=1 VSCLIC=1 VSPRIO=1 N_VSCTXTS=4 VSPRIO_W=1 INTCTLBITS=8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Report tool versions
        shell: bash
        run: |
          verilator --version
          bender --version
      - name: Checkout dependencies
        shell: bash
        run: make checkout
      # The image already provides verilator and bender directly, so the local
      # `oseda` wrapper (which would spawn another container) is disabled.
      - name: Run testbench
        shell: bash
        run: make vlt-sim OSEDA= SEED=1 ${{ matrix.params }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verilator-logs-${{ matrix.name }}
          path: |
            test/verilator/*/build.log
            test/verilator/*/sim.log
          if-no-files-found: ignore
